name: Collecte quotidienne des offres V.I.E

on:
  schedule:
    # Toutes les 30 minutes, en semaine, de 06h à 16h UTC — soit 08h à 18h à
    # Paris en été, 07h à 17h en hiver. Les entreprises françaises publient
    # pendant leurs heures ouvrées : inutile de solliciter l'API la nuit.
    #
    # À savoir : GitHub place les tâches planifiées dans une file d'attente
    # partagée. Un retard de 15 à 60 minutes est normal et ne signale aucun
    # dysfonctionnement.
    - cron: "*/30 6-16 * * 1-5"
    # Un passage le week-end, à midi, au cas où.
    - cron: "0 10 * * 6,0"
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la demande
  push:
    branches: [main]

permissions:
  contents: write           # pour committer data/offers.json
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuser de publier si la clé a fui dans le dépôt
        run: |
          if git ls-files --error-unmatch cle-api.txt >/dev/null 2>&1; then
            echo "::error::cle-api.txt est suivi par Git et serait publié."
            echo "::error::Corrige avec : git rm --cached cle-api.txt puis committe."
            exit 1
          fi
          echo "Aucune clé exposée dans le dépôt."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r collector/requirements.txt

      - name: Vérifier que la clé d'API est configurée
        run: |
          if [ -z "${{ secrets.VIE_API_KEY }}" ]; then
            echo "::warning::Le secret VIE_API_KEY est absent."
            echo "::warning::Réglages > Secrets and variables > Actions > New repository secret"
            echo "::warning::La collecte utilisera la clé intégrée au script, qui peut être périmée."
          fi

      - name: Collecter et noter les offres
        id: collect
        continue-on-error: true    # une API indisponible ne doit pas casser le site
        env:
          # La clé vient du coffre du dépôt. Elle n'apparaît ni dans le code,
          # ni dans les journaux : GitHub la masque automatiquement.
          VIE_API_KEY: ${{ secrets.VIE_API_KEY }}
          # Canal de notification poussée. Secret lui aussi : qui connaît le
          # nom du canal peut recevoir tes alertes, ou t'en envoyer.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Score minimum déclenchant une alerte.
          NOTIFY_MIN_SCORE: "50"
        run: python collector/collect.py

      - name: Signaler une collecte en échec
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::La collecte a échoué. Le site conserve les offres précédentes."
          echo "::warning::Cause la plus fréquente : clé X-API-KEY changée par Business France."

      - name: Committer les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/offers.json; then
            echo "Aucun changement dans les offres."
            exit 0
          fi

          # Le fichier de données est régénéré intégralement à chaque collecte :
          # il n'y a rien à fusionner avec une version concurrente, la plus
          # récente fait autorité. En cas de refus du dépôt (« fetch first »),
          # on se recale sur l'état distant et on réapplique notre fichier.
          cp data/offers.json /tmp/offers.json

          for tentative in 1 2 3; do
            git add data/offers.json
            git commit -q -m "Collecte du $(date -u '+%Y-%m-%d %H:%M')" || true

            if git push -q; then
              echo "Données enregistrées (tentative $tentative)."
              exit 0
            fi

            echo "Dépôt modifié entre-temps, recalage sur l'état distant…"
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/offers.json data/offers.json
            sleep 2
          done

          echo "::warning::Enregistrement abandonné après 3 tentatives."
          echo "::warning::Le site est publié malgré tout avec les offres de cette collecte."
          exit 0

      - name: Assembler le site
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          if [ -f data/offers.json ]; then
            cp data/offers.json _site/data/
          else
            echo '{"offers":[],"total_scanned":0,"total_kept":0}' > _site/data/offers.json
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    # La règle ne s'applique qu'à la publication, et non à toute la chaîne :
    # sinon une collecte attend la fin de la précédente, et la file s'allonge.
    #
    # « cancel-in-progress: true » : avec une collecte toutes les 30 minutes,
    # une publication en attente est déjà périmée quand la suivante arrive.
    # Mieux vaut l'annuler et publier la plus récente.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
